aid: syfe
name: Syfe
description: >-
  Syfe is a Singapore-headquartered digital wealth management platform, licensed by the Monetary
  Authority of Singapore under Capital Markets Services licence CMS100837 and operating in Singapore,
  Hong Kong and Australia (where it trades as Selfwealth by Syfe). Founded in 2019 by Dhruv Arora and
  backed by Valar Ventures and Unbound, Syfe combines robo-advised managed portfolios (Core, REIT+,
  Income+, Select Themes), a self-directed brokerage for US, Singapore and Hong Kong listed stocks and
  ETFs, and Cash+ cash-management products, alongside a private wealth and a business treasury offering.
  Syfe is a consumer and business end-user product company: as of this profile it publishes no public
  developer portal, API reference, machine-readable specification, SDK or webhook surface. Its
  application backend at api.syfe.com is a private, WAF-protected first-party host and is not a
  documented developer API.
